[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ai/voice-query"
  to = "/.netlify/functions/voice"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai/tts"
  to = "/.netlify/functions/voice"
  status = 200
  force = true

[[redirects]]
  from = "/api/voice/ivr"
  to = "/.netlify/functions/voice"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
